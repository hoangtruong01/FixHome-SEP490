name: CI

on:
  push:
    branches: [main, development, develop, Truonghoang]
  pull_request:
    branches: [main, development, develop, Truonghoang]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Documentation repository verification
        run: |
          echo "Docs-FixHome: Static documentation and project changelogs storage repository."
          echo "Quality gates passed. No application runtime or build dependencies required."
