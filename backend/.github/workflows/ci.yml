name: CI

on:
  push:
    branches: [main, development, develop]
  pull_request:
    branches: [main, development, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixhome
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Integration tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: fixhome
          JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
